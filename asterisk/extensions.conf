; ============================================================
; Asterisk Dialplan
; Internal SIP extensions + simple IVR
; ============================================================

[internal]

; ------------------------------------------------------------
; Direct extension-to-extension calling
; ------------------------------------------------------------

; Dial 1001 -> ring SIP client 1001 for 20 seconds
exten => 1001,1,Dial(PJSIP/1001,20)
 same => n,Hangup()

; Dial 1002 -> ring SIP client 1002 for 20 seconds
exten => 1002,1,Dial(PJSIP/1002,20)
 same => n,Hangup()


; ------------------------------------------------------------
; IVR entry point
; ------------------------------------------------------------

; Dial 500 to enter the IVR menu
exten => 500,1,Goto(ivr,s,1)


; ============================================================
; IVR MENU
; ============================================================

[ivr]

; Answer the incoming IVR call
exten => s,1,Answer()

; Play Asterisk's built-in demo prompt.
; This is used as a simple working IVR prompt for the project.
; Replace with a custom prompt later if desired.
 same => n,Background(demo-congrats)

; Wait up to 5 seconds for DTMF input
 same => n,WaitExten(5)


; ------------------------------------------------------------
; IVR options
; ------------------------------------------------------------

; Press 1 -> call client 1001
exten => 1,1,Dial(PJSIP/1001,20)
 same => n,Hangup()

; Press 2 -> call client 1002
exten => 2,1,Dial(PJSIP/1002,20)
 same => n,Hangup()

; Press 9 -> repeat the IVR menu
exten => 9,1,Goto(ivr,s,1)


; ------------------------------------------------------------
; Invalid input
; ------------------------------------------------------------

; If the caller presses an unsupported key
exten => i,1,Playback(pbx-invalid)
 same => n,Goto(ivr,s,1)


; ------------------------------------------------------------
; Timeout
; ------------------------------------------------------------

; If no digit is entered within the timeout
exten => t,1,Playback(vm-goodbye)
 same => n,Hangup()
